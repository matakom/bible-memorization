scripts:
  # Code Generation
  gen:watch: "dart run build_runner watch --delete-conflicting-outputs"
  gen:build: "dart run build_runner build --delete-conflicting-outputs"
  
  # App Commands
  run:dev: "flutter run"
  install:dev: "flutter install"
  
  run:prod: "flutter run --release"
  install:prod: "flutter install --release"

  build:apk: "flutter build apk"
  build:aab: "flutter build appbundle"
  build:ios: "flutter build ipa"