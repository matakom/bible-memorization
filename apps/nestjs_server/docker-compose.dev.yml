services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:Z
      - /app/node_modules
      - /app/dist
    command: npm run start:dev
    container_name: nestjs_app
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: on-failure

  db:
    image: postgres:18
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USERNAME} 
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data:Z
    restart: on-failure
    ports:
      - "5432:5432"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cf_tunnel
    command: tunnel --config /etc/cloudflare/config.yml run
    volumes:
      - ./cloudflare:/etc/cloudflare:ro,Z
    depends_on:
      - app
    restart: on-failure

volumes:
  db_data:
